<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .blade { fill: #1a1a1a; }
    .ring { fill: none; stroke: #1a1a1a; stroke-width: 4; }
    .screw { fill: #b8860b; }
    @media (prefers-color-scheme: dark) {
      .blade { fill: #f0f0f0; }
      .ring { stroke: #f0f0f0; }
      .screw { fill: #daa520; }
    }
  </style>
  <!-- Left blade -->
  <path class="blade" d="M60 58 L18 20 C15 17 15 12 18 9 L20 7 C23 4 28 4 31 7 L64 50Z"/>
  <!-- Right blade -->
  <path class="blade" d="M68 58 L110 20 C113 17 113 12 110 9 L108 7 C105 4 100 4 97 7 L64 50Z"/>
  <!-- Left ring (finger hole) -->
  <ellipse class="ring" cx="22" cy="100" rx="16" ry="18" transform="rotate(-25 22 100)"/>
  <!-- Left handle connecting to ring -->
  <path class="blade" d="M56 64 L32 86 C30 88 28 90 30 92 L34 88 C36 86 38 84 40 82 L62 68Z"/>
  <!-- Right ring (finger hole) -->
  <ellipse class="ring" cx="106" cy="100" rx="16" ry="18" transform="rotate(25 106 100)"/>
  <!-- Right handle connecting to ring -->
  <path class="blade" d="M72 64 L96 86 C98 88 100 90 98 92 L94 88 C92 86 90 84 88 82 L66 68Z"/>
  <!-- Center screw -->
  <circle class="screw" cx="64" cy="60" r="5"/>
</svg>
